version: 2
updates:
  # The two that actually matter here. Go modules are listed too, but the
  # binary has no third party dependencies, so that one is a safety net for
  # if that ever changes.

  # Base images: this is how the Go toolchain CVEs get caught early. The
  # builder image is what determines the stdlib compiled into the binary.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: fix          # a base image bump is a fix, so it triggers a release

  # Action versions. Pinned tags go stale and silently stop receiving fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      # Group only the safe bumps so they can auto-merge as one PR. Majors are
      # deliberately left ungrouped: one major in a group of ten would block the
      # other nine from ever merging automatically.
      actions-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: fix
