name: tag

# Auto-tag on merge to main. The tag then triggers release.yml, which builds and
# publishes the image — so a merge is the only manual step in a release.
#
# Version bump is derived from Conventional Commit subjects:
#   feat:            -> minor
#   fix: / perf:     -> patch
#   BREAKING CHANGE  -> major
# Anything else (docs:, ci:, chore:, refactor:) does not produce a release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false           # no release for docs/ci/chore-only pushes
          release_branches: main
          tag_prefix: v

      - name: Summary
        run: |
          if [ -z "${{ steps.tag.outputs.new_tag }}" ]; then
            echo "No release-worthy commits since the last tag; nothing tagged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tagged **${{ steps.tag.outputs.new_tag }}** (${{ steps.tag.outputs.release_type }})" >> "$GITHUB_STEP_SUMMARY"
          fi
