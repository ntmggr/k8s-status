name: tag

# Auto-tag on merge to main. The tag then triggers release.yml, which builds and
# publishes the image — so a merge is the only manual step in a release.
#
# Version bump is derived from Conventional Commit subjects:
#   feat:            -> minor
#   fix: / perf:     -> patch
#   BREAKING CHANGE  -> major
# Anything else (docs:, ci:, chore:, refactor:) does not produce a release.
on:
  push:
    branches: [main]

# Least privilege by default; the one job that needs to write asks for it below.
permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the stamped tag
      actions: write    # dispatch release.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Compute the version WITHOUT pushing the tag yet. The chart has to be stamped
      # with that version first, otherwise the tag lands on a commit whose Chart.yaml
      # still advertises the previous release -- which is how appVersion silently
      # drifted to 0.2.3 while the published image was 0.7.3.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false           # no release for docs/ci/chore-only pushes
          release_branches: main
          tag_prefix: v
          dry_run: true

      # Branch protection on main rejects a push from GITHUB_TOKEN, so the stamped
      # Chart.yaml is committed off-branch and the tag is placed on that commit.
      # Consumers resolve the chart by tag, so what has to be self-consistent is the
      # tagged tree; main keeps the 0.0.0-dev placeholder.
      - name: Stamp chart version and push tag
        if: steps.tag.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          sed -i -E "s|^version: .*|version: ${VERSION}|" charts/k8s-status/Chart.yaml
          sed -i -E "s|^appVersion: .*|appVersion: \"${VERSION}\"|" charts/k8s-status/Chart.yaml
          grep -E '^(version|appVersion):' charts/k8s-status/Chart.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): stamp chart ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"

      # A tag pushed with GITHUB_TOKEN does NOT trigger other workflows -- GitHub
      # blocks that to prevent recursion. So dispatch the release explicitly,
      # otherwise the tag is created and nothing is ever published.
      - name: Trigger release
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.tag.outputs.new_tag }}"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f version="${version#v}"
          echo "Dispatched release for ${version}"

      - name: Summary
        run: |
          if [ -z "${{ steps.tag.outputs.new_tag }}" ]; then
            echo "No release-worthy commits since the last tag; nothing tagged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tagged **${{ steps.tag.outputs.new_tag }}** (${{ steps.tag.outputs.release_type }})" >> "$GITHUB_STEP_SUMMARY"
          fi
