name: codeql

# Static analysis of the Go source. Complements govulncheck and Trivy, which look at
# dependencies and the image rather than at the code in this repository.
on:
  push:
    branches: [main]
    paths-ignore: &non-code ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    branches: [main]
    paths-ignore: *non-code
  schedule:
    # Weekly, so a new rule release is picked up without waiting for a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
