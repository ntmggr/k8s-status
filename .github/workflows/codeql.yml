name: codeql

# Static analysis of the Go source. Complements govulncheck and Trivy, which look at
# dependencies and the image rather than at the code in this repository.
on:
  push:
    branches: [main]
    paths-ignore: &non-code ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    branches: [main]
    paths-ignore: *non-code
  schedule:
    # Weekly, so a new rule release is picked up without waiting for a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
