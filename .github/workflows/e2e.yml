name: e2e

# Browser tests of the rendered page against hack/fixture-server: layout at three
# widths, an axe accessibility scan, and full-page screenshots in light and dark.
# Advisory: not a required check.
#
# Screenshot baselines are never committed. Runs on main (every push, plus weekly so
# the artifact never expires) record main's rendering as the e2e-baselines artifact;
# pull requests compare against the newest one. An intended UI change shows up as a
# diff on its PR and becomes the baseline once merged.

on:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - hack/**
      - testdata/**
      - e2e/**
      - go.mod
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - hack/**
      - testdata/**
      - e2e/**
      - go.mod
      - .github/workflows/e2e.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_ARTIFACT: e2e-baselines
  SCREENSHOT_DIR: e2e/tests/__screenshots__

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # find and download main's baseline artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: install
        working-directory: e2e
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: fetch main's baseline
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml \
              --branch main --status completed --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name "$BASELINE_ARTIFACT" --dir "$SCREENSHOT_DIR" 2>/dev/null; then
              echo "comparing against main run $run_id"
              exit 0
            fi
          done
          echo "::warning::no baseline from main yet; screenshots are recorded, not compared"

      - name: test (pull request)
        if: github.ref != 'refs/heads/main'
        working-directory: e2e
        run: npx playwright test --update-snapshots=missing

      - name: test and record baseline (main)
        if: github.ref == 'refs/heads/main'
        working-directory: e2e
        run: npx playwright test --update-snapshots=all

      - name: upload baseline
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: ${{ env.SCREENSHOT_DIR }}
          retention-days: 90
          if-no-files-found: error

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
