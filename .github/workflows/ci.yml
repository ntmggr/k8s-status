name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -cover

      - name: build
        run: go build ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: lint
        run: helm lint charts/srv-status

      # Render every optional path, so a broken template cannot merge unnoticed.
      - name: template
        run: |
          helm template srv-status charts/srv-status > /dev/null
          helm template srv-status charts/srv-status \
            --set ingress.enabled=true --set ingress.host=example.internal > /dev/null
          helm template srv-status charts/srv-status --set istio.enabled=true > /dev/null
          helm template srv-status charts/srv-status \
            --set config.nodeStats=true --set rbac.clusterRole=true > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in release.yml on a tag.
      # Loaded into the local daemon so the scanners below can read it.
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: srv-status:ci
          platforms: linux/amd64
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the build on a fixable HIGH/CRITICAL CVE. Unfixable ones are reported
      # but do not block, since there is nothing to upgrade to.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: srv-status:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan filesystem for leaked secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          format: table
          exit-code: "1"

      # CIS Docker Benchmark checks on the built image (non-root user, no setuid
      # binaries, healthcheck/metadata, no credentials in env or layers).
      - name: CIS Docker Benchmark (dockle)
        uses: erzz/dockle-action@v1
        with:
          image: srv-status:ci
          exit-code: "1"
          failure-threshold: fatal
