name: scorecard

# OpenSSF Scorecard grades the repository's supply chain: are actions pinned, is
# the branch protected, are releases signed, is there dependency update tooling.
# publish_results is what makes the public badge resolve; without it the API has
# no data and the badge reads "invalid repo path".
on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays, same cadence as dependabot
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # sign the results so they can be published
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        continue-on-error: true
        with:
          sarif_file: results.sarif
