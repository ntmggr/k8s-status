name: release

# Versioning is tag-driven: push v1.2.3 and that becomes the image tag and the
# binary's reported version. The tag is the single source of truth, so the image,
# the GitHub release and `k8s-status --version` can never disagree.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 1.2.3)"
        required: true

# Least privilege by default; publish elevates for the release it creates.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release and upload artifacts
      id-token: write   # keyless signing: cosign exchanges this for a short-lived cert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # A tag push checks out the tag already. A dispatch lands on the default
          # branch, so point it at the tag explicitly or goreleaser sees no tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Fail loudly rather than publishing a nonsense tag.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Never publish an image that does not pass its own tests.
      - name: Test
        run: go test ./... -race

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || 'ntmggr/k8s-status' }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.v.outputs.version, '-') }}

      # arm64 is not optional: these clusters are predominantly arm64 nodes.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chart version matches tag
        run: |
          chart="$(grep -E '^version:' charts/k8s-status/Chart.yaml | awk '{print $2}')"
          app="$(grep -E '^appVersion:' charts/k8s-status/Chart.yaml | tr -d '"' | awk '{print $2}')"
          echo "chart version=$chart appVersion=$app tag=${{ steps.v.outputs.version }}"
          # A warning here was ignored for 13 releases. The tag workflow stamps both
          # fields, so a mismatch now means the stamp did not run: fail the release
          # rather than publish a chart that points at the wrong image.
          if [ "$app" != "${{ steps.v.outputs.version }}" ] || [ "$chart" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::Chart version=$chart appVersion=$app do not match the released tag (${{ steps.v.outputs.version }})"
            exit 1
          fi

      # One job must own the GitHub release, otherwise two steps race to create the
      # same tag's release. goreleaser owns it, because it is the only one with
      # artifacts to attach: the cross-platform archives and checksums.txt.
      # softprops/action-gh-release previously did this and has been removed.
      #
      # The image is built and pushed above, not here, .goreleaser.yaml configures
      # no `dockers:` block on purpose. IMAGE_REPO is passed through so the release
      # notes name the image this same run pushed.
      #
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v4.1.2

      - name: Release binaries and GitHub release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ vars.DOCKERHUB_REPOSITORY || 'ntmggr/k8s-status' }}
          # Pin goreleaser to the version this run resolved. Left to its own
          # devices it uses `git describe`, which can pick a different tag and
          # publish a release whose number disagrees with the image just pushed.
          GORELEASER_CURRENT_TAG: v${{ steps.v.outputs.version }}
