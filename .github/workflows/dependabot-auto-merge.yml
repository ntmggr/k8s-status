name: dependabot auto-merge

# Approves and queues Dependabot PRs for auto-merge. GitHub only completes the
# merge once required status checks pass, so a failing build blocks it.
#
# Major version bumps are deliberately excluded: those are the ones that break
# things, and they deserve a human.
on: pull_request_target

# Least privilege by default; the merge job elevates below.
permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # enable auto-merge on the PR
      pull-requests: write   # approve and comment
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR"
          gh pr merge --auto --squash "$PR"

      - name: Flag majors for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR" --body "Major version bump, not auto-merging. Needs a human."
