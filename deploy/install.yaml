# srv-status — self-contained install.
#
#   kubectl apply -f deploy/install.yaml
#
# Replace __IMAGE__ first (scripts/install.sh does this for you).
# Read-only: the ServiceAccount can only get/list ArgoCD Applications in one namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: srv-status
  labels:
    app.kubernetes.io/name: srv-status
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srv-status
  namespace: srv-status
  labels:
    app.kubernetes.io/name: srv-status
---
# Namespaced Role, not a ClusterRole: the blast radius is provably one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srv-status
  namespace: argocd
  labels:
    app.kubernetes.io/name: srv-status
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srv-status
  namespace: argocd
  labels:
    app.kubernetes.io/name: srv-status
subjects:
  - kind: ServiceAccount
    name: srv-status
    namespace: srv-status
roleRef:
  kind: Role
  name: srv-status
  apiGroup: rbac.authorization.k8s.io
---
# Optional: uncomment this ClusterRole and ClusterRoleBinding when setting NODE_STATS: "true"
# below. Nodes are cluster-scoped, so the capacity section cannot be served by a Role.
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: srv-status-nodes
#   labels:
#     app.kubernetes.io/name: srv-status
# rules:
#   - apiGroups: [""]
#     resources: ["nodes"]
#     verbs: ["get", "list"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: srv-status-nodes
#   labels:
#     app.kubernetes.io/name: srv-status
# subjects:
#   - kind: ServiceAccount
#     name: srv-status
#     namespace: srv-status
# roleRef:
#   kind: ClusterRole
#   name: srv-status-nodes
#   apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srv-status
  namespace: srv-status
  labels:
    app.kubernetes.io/name: srv-status
data:
  ENV_NAME: "__ENV_NAME__"
  CLUSTER_NAME: "__CLUSTER_NAME__"
  ENV_TYPE: ""
  REGION: ""
  BASE_PATH: "/srv-status"
  ARGOCD_NAMESPACE: "argocd"
  ROOT_APP_NAME: "ocp-services"
  ARGOCD_UI_BASE: ""
  IGNORE_GLOBS: ""
  CACHE_TTL_SECONDS: "15"
  REFRESH_SECONDS: "30"
  # "true" also requires the ClusterRole above to be uncommented.
  NODE_STATS: "false"
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-status
  namespace: srv-status
  labels:
    app.kubernetes.io/name: srv-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srv-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srv-status
    spec:
      serviceAccountName: srv-status
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: srv-status
          image: __IMAGE__
          envFrom:
            - configMapRef:
                name: srv-status
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /srv-status/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /srv-status/healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: srv-status
  namespace: srv-status
  labels:
    app.kubernetes.io/name: srv-status
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: srv-status
  ports:
    - name: http
      port: 80
      targetPort: http
