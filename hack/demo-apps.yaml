# Sample ArgoCD Applications for the local demo. Every value here is invented and
# every repoURL points at the reserved .invalid TLD, exactly like testdata/.
#
# Between them these nine children hit all seven states k8s-status renders. The
# classification rules are in README "How it works"; the short version is that the
# first matching rule wins, so `legacy-batch` is PRUNE even though it is also
# Degraded, and `checkout-web` is PROGRESSING rather than DRIFT.
#
# The root app name is arbitrary. It is found by shape, being the Application that
# owns the most other Applications, so no ROOT_APP_NAME override is needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
# Root app-of-apps. It supplies the environment header (version, revision, deploy
# history, EnvType) and, via status.resources[].requiresPruning, the only source of
# prune information. phase Succeeded means "settled", which is what lets rule 6
# report DRIFT instead of PROGRESSING.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  labels:
    EnvType: dev
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/example/platform/apps.git
    path: envs/demo
    targetRevision: develop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
status:
  health:
    status: Degraded
    message: one or more child applications are degraded
  sync:
    status: OutOfSync
    revision: 5f2a1c93d84b7e60a1fc2385bd47e0916cb3d772
  operationState:
    phase: Succeeded
    message: successfully synced (all tasks run)
    finishedAt: "2026-08-24T09:12:33Z"
  history:
    - id: 41
      revision: c07be5142ad938f6b0c14e7823da95f6017bb4de
      deployedAt: "2026-08-22T14:05:02Z"
    - id: 42
      revision: 5f2a1c93d84b7e60a1fc2385bd47e0916cb3d772
      deployedAt: "2026-08-24T09:12:10Z"
  resources:
    - group: argoproj.io
      kind: Application
      name: payments-api
      namespace: argocd
      status: Synced
    - group: argoproj.io
      kind: Application
      name: orders-api
      namespace: argocd
      status: Synced
    - group: argoproj.io
      kind: Application
      name: admin-ui
      namespace: argocd
      status: Synced
    - group: argoproj.io
      kind: Application
      name: transcode-gpu
      namespace: argocd
      status: Synced
    - group: argoproj.io
      kind: Application
      name: search-api
      namespace: argocd
      status: OutOfSync
    - group: argoproj.io
      kind: Application
      name: checkout-web
      namespace: argocd
      status: OutOfSync
    - group: argoproj.io
      kind: Application
      name: metrics-relay
      namespace: argocd
      status: Synced
    - group: argoproj.io
      kind: Application
      name: nightly-report
      namespace: argocd
      status: Synced
    # The one entry Git no longer asks for. This flag is what makes legacy-batch PRUNE.
    - group: argoproj.io
      kind: Application
      name: legacy-batch
      namespace: argocd
      status: OutOfSync
      requiresPruning: true
---
