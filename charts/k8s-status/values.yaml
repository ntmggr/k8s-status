# Number of pods. The page is stateless but there is no reason to run more than one.
replicaCount: 1

image:
  # Container image repository.
  repository: docker.io/ntmggr/k8s-status
  # Image tag. Empty falls back to .Chart.AppVersion.
  tag: ""
  # Image pull policy.
  pullPolicy: IfNotPresent

# Secrets used to pull the image from a private registry.
imagePullSecrets: []

# Override the chart name used in resource names.
nameOverride: ""
# Override the full generated resource name.
fullnameOverride: ""

serviceAccount:
  # Create the ServiceAccount. Set false to bring your own.
  create: true
  # Name of the ServiceAccount. Empty uses the generated fullname.
  name: ""
  # Deliberately empty: k8s-status makes zero AWS API calls, so it needs no IRSA
  # eks.amazonaws.com/role-arn annotation and no cloud credentials of any kind.
  annotations: {}

rbac:
  # Create the namespaced Role and RoleBinding granting read access to Applications.
  create: true
  # Namespace holding the ArgoCD Application resources; Role and RoleBinding are created here.
  argocdNamespace: argocd
  # Create a ClusterRole and ClusterRoleBinding for the opt-in sections. Grants get/list
  # on nodes for config.nodeStats, get/list on deployments, statefulsets and daemonsets
  # when config.unmanaged is on, and get/list on helmreleases and kustomizations when
  # config.sources includes flux. Nothing cluster-scoped is rendered while this is false.
  clusterRole: false
  # Namespace holding the mesh-wide Istio PeerAuthentication object read by
  # config.meshMTLS; a namespaced Role and RoleBinding are created here, independent
  # of clusterRole above. config.meshMTLS also creates its own ClusterRole granting
  # cluster-wide list on peerauthentications, for the per-service policy filter,
  # equally independent of clusterRole above.
  istioNamespace: istio-system

# Application configuration; each key maps 1:1 to an environment variable.
config:
  # ENV_NAME - human-readable environment name shown in the page header.
  envName: unknown
  # ENV_TYPE - free-form environment class, e.g. dev / stage / prod.
  envType: ""
  # REGION - cloud region shown in the page header.
  region: ""
  # CLUSTER_NAME - cluster name shown in the page header.
  clusterName: ""
  # BASE_PATH - path prefix the app serves natively; no proxy rewrite is required.
  basePath: /k8s-status
  # SOURCES - comma-separated GitOps controllers to read: argocd, flux, or both. "auto"
  # detects which CRDs the cluster serves. Flux additionally requires rbac.clusterRole.
  sources: argocd
  # ARGOCD_NAMESPACE - namespace the app reads Applications from.
  argocdNamespace: argocd
  # ROOT_APP_NAME - app-of-apps Application used to derive pruning orphans. Empty
  # detects it: the Application that owns the most other Applications wins. Set it
  # only if your cluster has more than one app-of-apps.
  rootAppName: ""
  # ARGOCD_UI_BASE - base URL of the ArgoCD UI for deep links. Empty disables links.
  argocdUIBase: ""
  # IGNORE_GLOBS - comma-separated globs of Application names to hide.
  ignoreGlobs: ""
  # CACHE_TTL_SECONDS - how long a rendered snapshot is reused.
  cacheTTLSeconds: 15
  # REFRESH_SECONDS - meta-refresh interval of the HTML page.
  refreshSeconds: 30
  # NODE_STATS - render the cluster capacity section. Requires rbac.clusterRole.
  nodeStats: false
  # PENDING_REASONS - explain why a service's pods cannot be scheduled, and grey the
  # row. Reads Events, not pods. Requires rbac.clusterRole.
  pendingReasons: false
  # UNMANAGED - list workloads that ArgoCD does not manage. Requires rbac.clusterRole.
  unmanaged: false
  # UNMANAGED_IGNORE_NS - comma-separated namespace globs excluded from that list.
  unmanagedIgnoreNamespaces: ""
  # MESH_MTLS - show the cluster-wide Istio mTLS gauge. Reads one named
  # PeerAuthentication object via a namespaced Role in rbac.istioNamespace, independent
  # of rbac.clusterRole. Also reads every PeerAuthentication in every namespace, via
  # its own ClusterRole (list only), to resolve each service's own effective policy
  # against namespace/workload overrides -- combine with config.azSpread to show it.
  meshMTLS: false
  # AZ_SPREAD - show how many availability zones each service's running pods actually
  # sit in. Requires config.nodeStats and rbac.clusterRole; reads Running pods under the
  # same pods grant as pendingReasons.
  azSpread: false
  # PORT - container listen port.
  port: 8080

service:
  # Service type.
  type: ClusterIP
  # Service port.
  port: 80

ingress:
  # Create an Ingress. No path rewrite is used: the app serves config.basePath itself.
  enabled: false
  # ingressClassName.
  className: ""
  # Extra annotations for the Ingress.
  annotations: {}
  # Hostname to serve on. Required when enabled.
  host: ""
  # TLS blocks passed straight through to the Ingress spec.
  tls: []

istio:
  # Create an Istio VirtualService. No rewrite is used, for the same reason as Ingress.
  enabled: false
  # Gateways to attach the VirtualService to.
  gateway: []
  # Hosts served by the VirtualService.
  hosts: []

# Container resource requests and limits. No CPU limit on purpose, to avoid throttling.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Node selector for pod scheduling.
nodeSelector: {}

# Tolerations for pod scheduling.
tolerations: []

# Affinity rules for pod scheduling.
affinity: {}

# Extra annotations added to the pod.
podAnnotations: {}

# Extra labels added to the pod.
podLabels: {}
